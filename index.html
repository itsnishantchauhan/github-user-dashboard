<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to Git-Hub Dashboard</h1>

    <div class="containerDiv">

        <div class="searchDiv">
            <input type="text" placeholder="Enter username here....!" id="inputBox">
            <button class="searchBtn">Search</button>
        </div>

        <div class="infoDiv">
            <div>Name: <span class="ownerName">xyz</span></div>
            <div>Username: <span class="username">xx</span></div>
            <div>Public Repos: <span class="repoDetail">xx</span></div>
            <div>
                Followers: <span class="followers">xx</span>
            <br>
                Following: <span class="following">xx</span>
            </div>
                    
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
